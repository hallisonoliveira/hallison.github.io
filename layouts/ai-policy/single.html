{{ define "main" }}
  <article class="mx-auto max-w-3xl pb-24">
    <header class="mb-16 border-b-2 border-outline-variant/30 pb-10">
      <p class="mb-4 font-label text-xs font-semibold uppercase tracking-[0.2em] text-primary-container">{{ i18n "ai_usage_label" }}</p>
      <h1 class="font-headline text-5xl font-extrabold tracking-tighter text-on-surface md:text-7xl">{{ .Title }}</h1>
      {{ with .Description }}
        <p class="mt-6 font-body text-2xl leading-relaxed text-on-surface-variant">{{ . }}</p>
      {{ end }}
    </header>
    <div class="prose prose-lg max-w-none prose-headings:font-headline prose-headings:font-bold prose-headings:text-on-surface prose-h2:mt-14 prose-h2:mb-5 prose-p:font-body prose-p:text-xl prose-p:leading-relaxed prose-p:text-on-surface prose-li:font-body prose-li:text-lg prose-li:text-on-surface prose-a:text-primary-container prose-a:underline">
      {{ .Content }}
    </div>
  </article>
{{ end }}
